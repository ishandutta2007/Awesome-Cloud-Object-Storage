<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: url(#titleGrad); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes float1 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }

      .floating-node-1 { animation: float1 6s ease-in-out infinite; }
      .floating-node-2 { animation: float2 7s ease-in-out infinite; }
      .pulse-bg { animation: pulse 4s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="300" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Elements (Glowing Orbs & Flow Lines) -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.08" class="pulse-bg"/>
  <circle cx="1050" cy="220" r="150" fill="#818cf8" opacity="0.08" class="pulse-bg"/>
  
  <!-- Dynamic Graphic Background Connections (Left & Right Flanks) -->
  <!-- Left Graphic Element: Storage Cluster Illustration -->
  <g class="floating-node-1" opacity="0.4">
    <rect x="60" y="60" width="140" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="85" cy="80" r="4" fill="#34d399"/>
    <line x1="100" y1="80" x2="180" y2="80" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <rect x="80" y="130" width="140" height="40" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="105" cy="150" r="4" fill="#38bdf8"/>
    <line x1="120" y1="150" x2="200" y2="150" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <rect x="60" y="200" width="140" height="40" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="85" cy="220" r="4" fill="#f43f5e"/>
    <line x1="100" y1="220" x2="180" y2="220" stroke="#475569" stroke-width="2" stroke-linecap="round"/>

    <path d="M 200 80 L 250 150 L 220 220" fill="none" stroke="#38bdf8" stroke-width="1.5" class="data-stream"/>
  </g>

  <!-- Right Graphic Element: Cloud & Edge Nodes -->
  <g class="floating-node-2" opacity="0.4">
    <rect x="980" y="70" width="150" height="45" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="1010" y="97" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">S3-Compatible</text>

    <rect x="950" y="140" width="150" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="975" y="167" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">Zero Egress</text>

    <rect x="990" y="210" width="150" height="45" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="1015" y="237" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">Self-Hosted</text>

    <path d="M 980 92 L 950 162 L 990 232" fill="none" stroke="#818cf8" stroke-width="1.5" class="data-stream"/>
  </g>

  <!-- Foreground Content (Clear & Centered, Unobstructed) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="470" y="45" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="600" y="66" class="badge" text-anchor="middle">☁️ CLOUD INFRASTRUCTURE</text>

    <!-- Main Title -->
    <text x="600" y="135" class="title">Awesome Cloud Object Storage</text>

    <!-- Subtitle -->
    <text x="600" y="175" class="subtitle">Curated SaaS Platforms &amp; High-Performance Open-Source Solutions</text>
    
    <!-- Feature Highlights / Badges in Foreground -->
    <g transform="translate(360, 210)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="70" y="22" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">⚡ S3 API</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="170" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="240" y="22" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">💸 Egress-Free Tiers</text>

      <!-- Pill 3 -->
      <rect x="340" y="0" width="140" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="410" y="22" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600" text-anchor="middle">🔓 Open-Source</text>
    </g>
  </g>
</svg>
